# Drop this into your repo at .github/workflows/kronos.yml — a minimal Vite (JS/TS) app.
# KRONOS CI runs YOUR commands. Note: styling (Tailwind, CSS) has no "test" to run —
# this checks your JS/TS logic and lints. Tune the commands to your project.

name: KRONOS CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  kronos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history for the diff-based checks

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: KRONOS CI
        uses: dzylab/kronos-ci@v0.7.0
        with:
          test-command: "npx vitest run"
          lint-command: "npx eslint ."
          lint-required: "true"
